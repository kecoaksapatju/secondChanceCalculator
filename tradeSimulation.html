<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecondChance Compound Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== CSS ASLI (TIDAK BERUBAH) ===== */
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  margin: 0;
  padding: 16px;
  overflow-x: hidden;
}

h2 { text-align: center; margin-bottom: 6px; }

.intro {
  text-align: center;
  font-size: 13px;
  color: #cbd5f5;
  margin-bottom: 16px;
}

.card {
  background: #020617;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}

label {
  font-size: 14px;
  display: block;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  margin-top: 4px;
}

button.calc-btn {
  margin-top: 18px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: #022c22;
  cursor: pointer;
}

/* ===== SUMMARY ===== */
.summary-title {
  text-align: center;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.summary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.summary-box {
  background: #020617;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #1e293b;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 6px;
}

.summary-row span:last-child { font-weight: bold; }

@media (min-width: 640px) {
  .summary-grid { grid-template-columns: 1fr 1fr; }
}

.info-bar {
  margin-top: 12px;
  padding: 10px 12px;
  font-size: 13px;
  background: #020617;
  border: 1px solid #1e293b;
  border-radius: 8px;
}

.chart-wrapper {
  margin-top: 20px;
  height: 260px;
}

.table-wrapper {
  margin-top: 20px;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  border: 1px solid #334155;
  padding: 8px;
  text-align: right;
}

th { background: #1e293b; }
td:first-child, th:first-child { text-align: center; }

/* ===== UI MENU (SAMA DENGAN TPSL.HTML) ===== */
.menu-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  background: #1e293b;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  z-index: 1000;
  border: 1px solid #334155;
}

.menu-toggle span {
  display: block;
  width: 20px;
  height: 2px;
  background: #e5e7eb;
  transition: 0.3s;
}

.side-nav {
  position: fixed;
  top: 0;
  right: -250px;
  width: 250px;
  height: 100%;
  background: #020617;
  z-index: 999;
  padding-top: 80px;
  transition: 0.3s;
  border-left: 1px solid #1e293b;
}

.side-nav.active { right: 0; }

.side-nav a {
  display: block;
  padding: 16px 24px;
  text-decoration: none;
  color: #e5e7eb;
  font-size: 16px;
  border-bottom: 1px solid #1e293b;
}

.side-nav a.active-link { color: #22c55e; font-weight: bold; }

.menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 998;
  display: none;
}

.menu-overlay.active { display: block; }

.menu-toggle.active span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
</style>
</head>

<body>

<div class="menu-overlay" onclick="toggleMenu()"></div>
<div class="menu-toggle" onclick="toggleMenu()">
  <span></span><span></span><span></span>
</div>

<nav class="side-nav">
  <a href="tpsl.html">TP/SL Calculator</a>
  <a href="tradeSimulation.html" class="active-link">Trade Simulation</a>
</nav>

<h2>SecondChance Calculator</h2>
<div class="intro">
ⓘ Kalkulator ini mensimulasikan dampak rata-rata win per trade terhadap pertumbuhan modal.
</div>

<div class="card">
  <label>Modal Awal ($)</label>
  <input id="modal" type="number" value="100">

  <label>Alokasi Posisi (% dari modal)</label>
  <input id="posPercent" type="number" value="5">

  <label>Profit per Trade (% dari posisi)</label>
  <input id="profitPercent" type="number" value="25">

  <label>WD Profit/Trade (%)</label>
  <input id="wdPercent" type="number" value="50">

  <label>WD interval</label>
  <input id="wdInterval" type="number" value="3">

  <label>Leverage (x)</label>
  <input id="leverage" type="number" value="100">

  <label>Fee Beli (%)</label>
  <input id="feeBuy" type="number" value="0.04">

  <label>Fee Jual (%)</label>
  <input id="feeSell" type="number" value="0.04">

  <label>Funding Fee (%)</label>
  <input id="fundingFee" type="number" value="0">

  <label>Jumlah Trade</label>
  <input id="loops" type="number" value="60">

  <button class="calc-btn" onclick="calculate()">Hitung</button>
</div>

<div id="result"></div>

<script>
/* ===== UI LOGIC MENU ===== */
function toggleMenu() {
  document.querySelector('.side-nav').classList.toggle('active');
  document.querySelector('.menu-toggle').classList.toggle('active');
  document.querySelector('.menu-overlay').classList.toggle('active');
}

/* ===== LOGIC ASLI (TIDAK BERUBAH) ===== */
let equityChart = null;

function calculate() {
  const modalAwal = Number(modal.value);
  let modalNow = modalAwal;

  const posPct = Number(posPercent.value) / 100;
  const profitPct = Number(profitPercent.value) / 100;
  const wdPct = Number(wdPercent.value) / 100;
  const wdInt = Number(wdInterval.value);
  const lev = Number(leverage.value);

  const feeRoundPct =
    Number(feeBuy.value) +
    Number(feeSell.value) +
    Number(fundingFee.value);

  const trades = Number(loops.value);

  let totalProfit = 0;
  let totalFee = 0;
  let totalWD = 0;
  let profitHistory = []; 

  let rows = "";
  let equity = [modalAwal];
  let labels = ["0"];

  for (let i = 1; i <= trades; i++) {
    const modalBefore = modalNow;
    const margin = modalBefore * posPct;

    const grossProfit = margin * profitPct;
    const fee = (margin * lev) * (feeRoundPct / 100);
    const netProfit = grossProfit - fee;

    profitHistory.push(netProfit);
    if (profitHistory.length > wdInt) {
      profitHistory.shift();
    }

    totalProfit += netProfit;
    totalFee += fee;

    let wd = 0;
    if (i % wdInt === 0 && profitHistory.length === wdInt) {
      const totalLast3Profit = profitHistory.reduce((acc, val) => acc + val, 0);
      wd = totalLast3Profit * wdPct;
      totalWD += wd;
      modalNow -= wd;
    }

    modalNow += netProfit; 
    equity.push(modalNow);
    labels.push(i.toString());

    rows += `<tr><td>${i}</td><td>${modalBefore.toFixed(2)}</td><td>${margin.toFixed(2)}</td><td>${netProfit.toFixed(2)}</td><td>${fee.toFixed(2)}</td><td>${modalNow.toFixed(2)}</td></tr>`;
  }

  const roi = (totalProfit / modalAwal) * 100;
  const avgProfit = totalProfit / trades;
  const lossLimitPct = feeRoundPct * lev;

  document.getElementById("result").innerHTML = `
  <div class="card">
    <div class="summary-title">SUMMARY</div>
    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-row"><span>Modal akhir</span><span>$${modalNow.toFixed(2)}</span></div>
        <div class="summary-row"><span>Total profit</span><span>$${totalProfit.toFixed(2)}</span></div>
        <div class="summary-row"><span>Total WD</span><span>$${totalWD.toFixed(2)}</span></div>
        <div class="summary-row"><span>ROI total</span><span>${roi.toFixed(1)}%</span></div>
      </div>
    </div>
    <div class="info-bar">Batas aman profit per trade: ${lossLimitPct.toFixed(2)}%</div>
    <div class="chart-wrapper"><canvas id="equityChart"></canvas></div>
    <div class="table-wrapper"><table><tr><th>#</th><th>Modal</th><th>Margin</th><th>Profit</th><th>Fee</th><th>Total</th></tr>${rows}</table></div>
  </div>`;

  drawChart(labels, equity);
}

function drawChart(labels, data) {
  const ctx = document.getElementById("equityChart");
  if (equityChart) equityChart.destroy();
  equityChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data,
        borderColor: "#22c55e",
        backgroundColor: "rgba(34,197,94,0.15)",
        tension: 0.25,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { title: { display: true, text: "Trade" } },
        y: { title: { display: true, text: "Modal ($)" } }
      }
    }
  });
}
</script>

</body>
</html>
