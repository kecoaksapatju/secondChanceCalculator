<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecondChance Compound Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    margin: 0;
    padding: 16px;
  }

  h2 { text-align: center; margin-bottom: 16px; }

  .card {
    background: #020617;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  label { font-size: 14px; margin-top: 12px; display: block; }

  input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    margin-top: 4px;
  }

  button {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    background: #22c55e;
    color: #022c22;
  }

  .summary-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .summary-box {
    background: #020617;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #1e293b;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .summary-row span:last-child { font-weight: bold; }

  @media (min-width: 640px) {
    .summary-grid { grid-template-columns: 1fr 1fr; }
  }

  .chart-wrapper { margin-top: 20px; }

  .table-wrapper {
    margin-top: 20px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    min-width: 720px;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    border: 1px solid #334155;
    padding: 8px;
    text-align: right;
  }

  th { background: #1e293b; }
  td:first-child, th:first-child { text-align: center; }
</style>
</head>

<body>

<h2>SecondChance Calculator</h2>

<div class="card">
  <label>Modal Awal ($)</label>
  <input id="modal" type="number" value="100">

  <label>Alokasi Posisi (% dari modal)</label>
  <input id="posPercent" type="number" value="5">

  <label>Profit per Trade (% dari posisi)</label>
  <input id="profitPercent" type="number" value="50">

  <label>Leverage (x)</label>
  <input id="leverage" type="number" value="200">

  <label>Fee Beli (%)</label>
  <input id="feeBuy" type="number" value="0.04">

  <label>Fee Jual (%)</label>
  <input id="feeSell" type="number" value="0.04">

  <label>Funding Fee (%)</label>
  <input id="fundingFee" type="number" value="0">

  <label>Jumlah Trade</label>
  <input id="loops" type="number" value="60">

  <button onclick="calculate()">Hitung</button>
</div>

<div id="result"></div>

<script>
let equityChart = null;

function calculate() {
  const modalAwal = Number(modal.value);
  let modalNow = modalAwal;

  const posPct = posPercent.value / 100;
  const profitPct = profitPercent.value / 100;
  const leverageVal = Number(leverage.value);
  const feeRate = (Number(feeBuy.value) + Number(feeSell.value) + Number(fundingFee.value)) / 100;
  const trades = Number(loops.value);

  let totalProfit = 0;
  let totalFee = 0;
  let rows = [];
  let equity = [modalAwal];
  let labels = ["0"];

  for (let i = 1; i <= trades; i++) {
    const modalBefore = modalNow;
    const margin = modalBefore * posPct;
    const notional = margin * leverageVal;
    const grossProfit = margin * profitPct;
    const fee = notional * feeRate;
    const netProfit = grossProfit - fee;

    modalNow += netProfit;
    totalProfit += netProfit;
    totalFee += fee;

    equity.push(modalNow);
    labels.push(i.toString());

    rows.push(`
      <tr>
        <td>${i}</td>
        <td>${modalBefore.toFixed(2)}</td>
        <td>${margin.toFixed(2)}</td>
        <td>${leverageVal}x</td>
        <td>${netProfit.toFixed(2)}</td>
        <td>${fee.toFixed(4)}</td>
        <td>${modalNow.toFixed(2)}</td>
      </tr>`);
  }

  const roi = (totalProfit / modalAwal) * 100;
  const avgProfit = totalProfit / trades;

  document.getElementById("result").innerHTML = `
  <div class="card">
    <div class="summary-title">SUMMARY</div>

    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-row"><span>Modal awal</span><span>$${modalAwal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Posisi per trade</span><span>${(posPct*100).toFixed(2)}%</span></div>
        <div class="summary-row"><span>Profit per trade</span><span>${(profitPct*100).toFixed(2)}%</span></div>
        <div class="summary-row"><span>Leverage</span><span>${leverageVal}x</span></div>
        <div class="summary-row"><span>Fee round trip</span><span>${(feeRate*100).toFixed(2)}%</span></div>
        <div class="summary-row"><span>Jumlah trade</span><span>${trades}</span></div>
      </div>

      <div class="summary-box">
        <div class="summary-row"><span>Modal akhir</span><span>$${modalNow.toFixed(2)}</span></div>
        <div class="summary-row"><span>Total profit</span><span>$${totalProfit.toFixed(2)}</span></div>
        <div class="summary-row"><span>Total fee</span><span>$${totalFee.toFixed(2)}</span></div>
        <div class="summary-row"><span>ROI total</span><span>${roi.toFixed(1)}%</span></div>
        <div class="summary-row"><span>Avg profit/trade</span><span>$${avgProfit.toFixed(2)}</span></div>
      </div>
    </div>

    <div class="chart-wrapper">
      <canvas id="equityChart"></canvas>
    </div>

    <div class="table-wrapper">
      <table>
        <tr>
          <th>#</th>
          <th>Modal</th>
          <th>Margin</th>
          <th>Lev</th>
          <th>Profit</th>
          <th>Fee</th>
          <th>Total</th>
        </tr>
        ${rows.join("")}
      </table>
    </div>
  </div>`;

  drawChart(labels, equity);
}

function drawChart(labels, data) {
  const ctx = document.getElementById("equityChart");
  if (equityChart) equityChart.destroy();

  equityChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data,
        borderColor: "#22c55e",
        backgroundColor: "rgba(34,197,94,0.15)",
        fill: true,
        tension: 0.25
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { title: { display: true, text: "Trade" } },
        y: { title: { display: true, text: "Modal ($)" } }
      }
    }
  });
}
</script>

</body>
</html>
