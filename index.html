<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecondChance Compound Calculator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  /* === GLOBAL FIX (WAJIB) === */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    margin: 0;
    padding: 16px;
  }

  h2 {
    text-align: center;
    margin-bottom: 16px;
  }

  .card {
    background: #020617;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  label {
    font-size: 14px;
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
  }

  input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    outline: none;
  }

  button {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    background: #22c55e;
    color: #022c22;
    cursor: pointer;
  }

  button:active {
    transform: scale(0.98);
  }

  .table-wrapper {
    overflow-x: auto;
    margin-top: 16px;
  }

  table {
    width: 100%;
    min-width: 600px;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    border: 1px solid #334155;
    padding: 8px;
    text-align: right;
  }

  th {
    background: #1e293b;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  td:first-child,
  th:first-child {
    text-align: center;
  }
</style>
</head>

<body>

<h2>SecondChance Calculator</h2>

<div class="card">
  <label>Modal Awal ($)</label>
  <input id="modal" type="number" value="100" step="0.01">

  <label>Alokasi Posisi (% dari modal)</label>
  <input id="posPercent" type="number" value="5">

  <label>Profit per Trade (% dari posisi)</label>
  <input id="profitPercent" type="number" value="50">

  <label>Fee Beli (%)</label>
  <input id="feeBuy" type="number" value="0.04" step="0.01">

  <label>Fee Jual (%)</label>
  <input id="feeSell" type="number" value="0.04" step="0.01">

  <label>Funding Fee (%)</label>
  <input id="fundingFee" type="number" value="0" step="0.01">

  <label>Jumlah Compound</label>
  <input id="loops" type="number" value="60">

  <button onclick="calculate()">Hitung</button>
</div>

<div id="result"></div>

<script>
function calculate() {
  let modal = parseFloat(document.getElementById("modal").value);
  const posPct = parseFloat(document.getElementById("posPercent").value) / 100;
  const profitPct = parseFloat(document.getElementById("profitPercent").value) / 100;
  const feeBuy = parseFloat(document.getElementById("feeBuy").value) / 100;
  const feeSell = parseFloat(document.getElementById("feeSell").value) / 100;
  const funding = parseFloat(document.getElementById("fundingFee").value) / 100;
  const loops = parseInt(document.getElementById("loops").value);

  let html = `
  <div class="table-wrapper">
    <table>
      <tr>
        <th>#</th>
        <th>Modal</th>
        <th>Posisi</th>
        <th>Profit</th>
        <th>Fee</th>
        <th>Total</th>
      </tr>`;

  for (let i = 1; i <= loops; i++) {
    let modalAwal = modal;
    let posisi = modalAwal * posPct;
    let grossProfit = posisi * profitPct;
    let fee = posisi * (feeBuy + feeSell + funding);
    let netProfit = grossProfit - fee;
    let modalAkhir = modalAwal + netProfit;

    html += `
      <tr>
        <td>${i}</td>
        <td>${modalAwal.toFixed(2)}</td>
        <td>${posisi.toFixed(2)}</td>
        <td>${netProfit.toFixed(2)}</td>
        <td>${fee.toFixed(4)}</td>
        <td>${modalAkhir.toFixed(2)}</td>
      </tr>`;

    modal = modalAkhir;
  }

  html += `
    </table>
  </div>`;

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
