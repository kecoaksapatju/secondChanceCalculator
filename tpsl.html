<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Take Profit & Stop Loss Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 16px;
  margin: 0;
}

h2 {
  text-align: center;
  margin-bottom: 12px;
}

.card {
  background: #020617;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

/* ===== FORM ===== */
label {
  display: block;
  font-size: 14px;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 4px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}

button {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: #022c22;
  cursor: pointer;
}

/* ===== RESULT ===== */
.result {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.6;
}

.info {
  display: inline-block;
  font-size: 14px;
  color: #007bff;
  cursor: pointer;
  margin-left: 5px;
}

.info i {
  font-size: 12px;
  padding: 2px;
  border-radius: 50%;
  background-color: #007bff;
  color: white;
}
</style>
</head>

<h2>Take Profit & Stop Loss Calculator</h2>

  <input id="targetProfit" type="number" value="80" />

  <label>Target Loss (%) <span class="info" onclick="alert('Target loss adalah persentase kerugian yang Anda terima jika harga bergerak berlawanan, contoh: -600%.')"><i>i</i></span></label>

  <input id="leverage" type="number" value="200" />

  <button onclick="calculate()">Hitung</button>
</div>

<div id="result" class="result"></div>
