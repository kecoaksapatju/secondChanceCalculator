<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TP & SL Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 16px;
  margin: 0;
}

h2 {
  text-align: center;
  margin-bottom: 12px;
}

.card {
  background: #020617;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

label {
  display: block;
  font-size: 14px;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 4px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}

button {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: #022c22;
  cursor: pointer;
}

.result {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>

<body>

<h2>TP & SL Calculator</h2>

<div class="card">
  <label>
    Harga Entry ⓘ
  </label>
  <input id="entryPrice" type="number" placeholder="Contoh: 0.745709">

  <label>
    Target Profit (%) ⓘ
  </label>
  <input id="targetProfit" type="number" value="80">

  <label>
    Target Loss (%) ⓘ
  </label>
  <input id="targetLoss" type="number" value="-600">

  <label>
    Leverage ⓘ
  </label>
  <input id="leverage" type="number" value="200">

  <button onclick="calculate()">Hitung</button>
</div>

<div id="result" class="result"></div>

<script>
function calculate() {
  const entry = Number(document.getElementById("entryPrice").value);
  const tpPct = Number(document.getElementById("targetProfit").value);
  const slPct = Number(document.getElementById("targetLoss").value);
  const lev = Number(document.getElementById("leverage").value);

  if (!entry || entry <= 0) {
    alert("Harga entry belum diisi");
    return;
  }

  const tpMove = tpPct / lev / 100;
  const slMove = slPct / lev / 100;

  const tpPrice = entry * (1 + tpMove);
  const slPrice = entry * (1 + slMove);

  document.getElementById("result").innerHTML = `
    <div class="card">
      <strong>Harga TP:</strong> ${tpPrice.toFixed(6)}<br>
      <strong>Harga SL:</strong> ${slPrice.toFixed(6)}
    </div>
  `;
}
</script>

</body>
</html>
