<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TP & SL Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 16px;
  margin: 0;
}

h2 {
  text-align: center;
  margin-bottom: 12px;
}

.card {
  background: #020617;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

/* ===== FORM ===== */
label {
  display: block;
  font-size: 14px;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 4px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}

button {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: #022c22;
  cursor: pointer;
}

.result {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.6;
}

/* ===== Deskripsi Keterangan ===== */
.description {
  font-size: 12px;
  font-style: italic;
  color: #a1a1a1;
  margin-top: -8px;
  text-align: center;
}

/* ===== Hasil ===== */
.result-box {
  background-color: #020617; /* Same as the top box */
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  margin-top: 8px; /* Reduced spacing */
}

.result-box p {
  font-size: 16px; /* Adjusted font size */
  font-weight: bold;
  color: #e5e7eb; /* Light text color */
  margin-bottom: 4px; /* Reduced spacing between title and value */
}

.result-box .value {
  font-size: 18px; /* Smaller font size */
  color: #000; /* Changed to black text */
  padding: 6px;
  border-radius: 4px;
  background-color: #fff; /* White background for value box */
  border: 1px solid #ccc; /* Light border for the value box */
}

/* ===== Kotak BUY dan SELL ===== */
.trade-selector {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.trade-box {
  width: 48%;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
}

.buy {
  background-color: #22c55e; /* Green */
  color: #022c22;
}

.sell {
  background-color: #ef4444; /* Red */
  color: #022c22;
}

.selected {
  outline: 3px solid #e5e7eb; /* Highlighted border */
}
</style>
</head>

<body>

<h2>TP & SL Calculator</h2>

<div class="description">
  <p>Tentukan BUY/SELL, masukkan harga entry, target profit, target loss, dan leverage untuk menghitung harga Take Profit (TP) dan Stop Loss (SL).</p>
</div>

<div class="card">
  <div class="trade-selector">
    <div class="trade-box buy" onclick="selectTrade('long')">BUY/LONG</div>
    <div class="trade-box sell" onclick="selectTrade('short')">SELL/SHORT</div>
  </div>

  <label>Harga Entry</label>
  <input id="entryPrice" type="number" placeholder="Contoh: 0.745709">

  <label>Target Profit (%)</label>
  <input id="targetProfit" type="number" value="80">

  <label>Stop Loss (%)</label>
  <input id="targetLoss" type="number" value="-600">

  <label>Leverage</label>
  <input id="leverage" type="number" value="200">

  <button onclick="calculate()">Hitung</button>
</div>

<div id="result" class="result"></div>

<script>
let selectedTrade = null; // Variabel untuk menyimpan tipe trade yang dipilih

function selectTrade(type) {
  selectedTrade = type; // Menyimpan pilihan trade yang dipilih
  
  // Menghapus outline dari kedua kotak
  document.querySelector('.buy').classList.remove('selected');
  document.querySelector('.sell').classList.remove('selected');
  
  // Menambahkan outline ke kotak yang dipilih
  if (type === 'long') {
    document.querySelector('.buy').classList.add('selected');
  } else if (type === 'short') {
    document.querySelector('.sell').classList.add('selected');
  }
}

function calculate() {
  const entry = Number(document.getElementById("entryPrice").value);
  const tpPct = Number(document.getElementById("targetProfit").value);
  const slPct = Number(document.getElementById("targetLoss").value);
  const lev = Number(document.getElementById("leverage").value);

  if (!entry || entry <= 0) {
    alert("Harga entry belum diisi");
    return;
  }
  
  if (!selectedTrade) {
    alert("Pilih terlebih dahulu jenis trade (BUY/LONG atau SELL/SHORT)");
    return;
  }

  const tpMove = tpPct / lev / 100;
  const slMove = slPct / lev / 100;

  let tpPrice, slPrice;

  if (selectedTrade === "long") {
    tpPrice = entry * (1 + tpMove);
    slPrice = entry * (1 + slMove);
  } else if (selectedTrade === "short") {
    tpPrice = entry * (1 - tpMove);
    slPrice = entry * (1 - slMove);
  }

  document.getElementById("result").innerHTML = `
    <div class="result-box">
      <p>Harga Take Profit (TP)</p>
      <div class="value" onclick="copyToClipboard('${tpPrice.toFixed(6)}')">${tpPrice.toFixed(6)}</div>

      <p>Harga Stop Loss (SL)</p>
      <div class="value" onclick="copyToClipboard('${slPrice.toFixed(6)}')">${slPrice.toFixed(6)}</div>
    </div>
  `;
}

function copyToClipboard(value) {
  navigator.clipboard.writeText(value).then(() => {
    alert(`Harga ${value} sudah tercopy ke clipboard!`);
  });
}
</script>

</body>
</html>
