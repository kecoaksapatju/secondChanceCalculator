<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TP & SL Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== CSS ASLI ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 16px;
  margin: 0;
  overflow-x: hidden;
}

h2 {
  text-align: center;
  margin-bottom: 12px;
}

.card {
  background: #020617;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

label {
  display: block;
  font-size: 14px;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 4px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}

button.calc-btn {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: #022c22;
  cursor: pointer;
}

.description {
  font-size: 12px;
  font-style: italic;
  color: #a1a1a1;
  margin-top: -8px;
  text-align: center;
}

.trade-selector {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.trade-box {
  width: 48%;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
}

.buy { background-color: #22c55e; color: #022c22; }
.sell { background-color: #ef4444; color: #022c22; }
.selected { outline: 3px solid #e5e7eb; }

.checkbox-container {
  margin-top: 12px;
  display: flex;
  justify-content: center;
}

.checkbox-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}

.checkbox-label input { width: auto; margin: 0; }

.result-box {
  background-color: #020617;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  margin-top: 8px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

.result-box .value {
  font-size: 18px;
  color: #000;
  padding: 6px;
  border-radius: 4px;
  background-color: #fff;
  border: 1px solid #ccc;
  cursor: pointer;
  margin-bottom: 10px;
}

/* ===== UI MENU NAVIGASI ===== */
.menu-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  background: #1e293b;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  z-index: 1000;
  border: 1px solid #334155;
}

.menu-toggle span {
  display: block;
  width: 20px;
  height: 2px;
  background: #e5e7eb;
  transition: 0.3s;
}

.side-nav {
  position: fixed;
  top: 0;
  right: -250px;
  width: 250px;
  height: 100%;
  background: #020617;
  z-index: 999;
  padding-top: 80px;
  transition: 0.3s;
  border-left: 1px solid #1e293b;
}

.side-nav.active { right: 0; }

.side-nav a {
  display: block;
  padding: 16px 24px;
  text-decoration: none;
  color: #e5e7eb;
  font-size: 16px;
  border-bottom: 1px solid #1e293b;
}

.side-nav a.active-link { color: #22c55e; font-weight: bold; }

.menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 998;
  display: none;
}

.menu-overlay.active { display: block; }

.menu-toggle.active span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
</style>
</head>

<body>

<div class="menu-overlay" onclick="toggleMenu()"></div>
<div class="menu-toggle" onclick="toggleMenu()">
  <span></span><span></span><span></span>
</div>

<nav class="side-nav">
  <a href="tpsl.html" class="active-link">TP/SL Calculator</a>
  <a href="tradeSimulation.html">Trade Simulation</a>
</nav>

<h2>TP & SL Calculator</h2>

<div class="description">
  <p>Tentukan posisi, masukkan harga entry, dan parameter lainnya.</p>
</div>

<div class="card">
  <div class="trade-selector">
    <div class="trade-box buy" onclick="selectTrade('long')">BUY/LONG</div>
    <div class="trade-box sell" onclick="selectTrade('short')">SELL/SHORT</div>
  </div>

  <label>Harga Entry</label>
  <input id="entryPrice" type="number" placeholder="Contoh: 0.745709">

  <label>Target Profit (%)</label>
  <input id="targetProfit" type="number" value="40">

  <label>Stop Loss (%)</label>
  <input id="targetLoss" type="number" value="-600">

  <label>Leverage</label>
  <input id="leverage" type="number" value="100">

  <div class="checkbox-container">
    <label class="checkbox-label">
      <input type="checkbox" id="includeFee" checked>
      Nett (include fee 0.08%)
    </label>
  </div>

  <button class="calc-btn" onclick="calculate()">Hitung</button>
</div>

<div id="result"></div>

<script>
/* ===== UI LOGIC ===== */
function toggleMenu() {
  document.querySelector('.side-nav').classList.toggle('active');
  document.querySelector('.menu-toggle').classList.toggle('active');
  document.querySelector('.menu-overlay').classList.toggle('active');
}

/* ===== LOGIC ASLI ===== */
let selectedTrade = null;
const fee = 0.0008;

function selectTrade(type) {
  selectedTrade = type;
  document.querySelector('.buy').classList.remove('selected');
  document.querySelector('.sell').classList.remove('selected');
  document.querySelector(type === 'long' ? '.buy' : '.sell').classList.add('selected');
}

function calculate() {
  const entry = Number(entryPrice.value);
  const tpPct = Number(targetProfit.value);
  const slPct = Number(targetLoss.value);
  const lev = Number(leverage.value);
  const nett = includeFee.checked;

  if (!entry || !selectedTrade) {
    alert("Lengkapi input & pilih posisi");
    return;
  }

  const tpMove = tpPct / lev / 100;
  const slMove = slPct / lev / 100;

  let tpIdeal, slIdeal, tpFinal, slFinal;

  if (selectedTrade === "long") {
    tpIdeal = entry * (1 + tpMove);
    slIdeal = entry * (1 + slMove);
    tpFinal = nett ? tpIdeal / (1 - fee) : tpIdeal;
    slFinal = nett ? slIdeal / (1 + fee) : slIdeal;
  } else {
    tpIdeal = entry * (1 - tpMove);
    slIdeal = entry * (1 - slMove);
    tpFinal = nett ? tpIdeal * (1 - fee) : tpIdeal;
    slFinal = nett ? slIdeal * (1 + fee) : slIdeal;
  }

  document.getElementById("result").innerHTML = `
    <div class="result-box">
      <p>Harga Take Profit (TP)</p>
      <div class="value" onclick="copyToClipboard('${tpFinal.toFixed(6)}')">${tpFinal.toFixed(6)}</div>
      <p>Harga Stop Loss (SL)</p>
      <div class="value" onclick="copyToClipboard('${slFinal.toFixed(6)}')">${slFinal.toFixed(6)}</div>
    </div>
  `;
}

function copyToClipboard(value) {
  const tempInput = document.createElement("input");
  tempInput.value = value;
  document.body.appendChild(tempInput);
  tempInput.select();
  document.execCommand("copy");
  document.body.removeChild(tempInput);
  alert(`Harga ${value} tercopy!`);
}
</script>

</body>
</html>
