<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TP & SL Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 16px;
  margin: 0;
}

h2 {
  text-align: center;
  margin-bottom: 12px;
}

.card {
  background: #020617;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

/* ===== FORM ===== */
label {
  display: block;
  font-size: 14px;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 4px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}

button {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: #022c22;
  cursor: pointer;
}

/* ===== BUY / SELL ===== */
.trade-selector {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.trade-box {
  width: 48%;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
}

.buy {
  background-color: #22c55e;
  color: #022c22;
}

.sell {
  background-color: #ef4444;
  color: #022c22;
}

.selected {
  outline: 3px solid #e5e7eb;
}

/* ===== CHECKBOX (FIX ASLI) ===== */
.checkbox-container {
  margin-top: 12px;
  display: flex;
  justify-content: center;
}

.checkbox-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  line-height: 1.4;
}

.checkbox-label input {
  width: auto;      /* 🔥 FIX PENTING */
  margin: 0;
}

/* ===== RESULT ===== */
.result-box {
  background-color: #020617;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  margin-top: 8px;
}

.result-box p {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 4px;
}

.result-box .value {
  font-size: 18px;
  color: #000;
  padding: 6px;
  border-radius: 4px;
  background-color: #fff;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<h2>TP & SL Calculator</h2>

<div class="card">
  <div class="trade-selector">
    <div class="trade-box buy" onclick="selectTrade('long')">BUY/LONG</div>
    <div class="trade-box sell" onclick="selectTrade('short')">SELL/SHORT</div>
  </div>

  <label>Harga Entry</label>
  <input id="entryPrice" type="number" placeholder="Contoh: 0.745709">

  <label>Target Profit (%)</label>
  <input id="targetProfit" type="number" value="80">

  <label>Stop Loss (%)</label>
  <input id="targetLoss" type="number" value="-600">

  <label>Leverage</label>
  <input id="leverage" type="number" value="200">

  <div class="checkbox-container">
    <label class="checkbox-label">
      <input type="checkbox" id="includeFee" checked>
      Nett (include fee 0.08%)
    </label>
  </div>

  <button onclick="calculate()">Hitung</button>
</div>

<div id="result"></div>

<script>
let selectedTrade = null;
const fee = 0.0008;

function selectTrade(type) {
  selectedTrade = type;
  document.querySelector('.buy').classList.remove('selected');
  document.querySelector('.sell').classList.remove('selected');
  document.querySelector(type === 'long' ? '.buy' : '.sell').classList.add('selected');
}

function calculate() {
  const entry = Number(entryPrice.value);
  const tpPct = Number(targetProfit.value);
  const slPct = Number(targetLoss.value);
  const lev = Number(leverage.value);
  const nett = includeFee.checked;

  if (!entry || !selectedTrade) {
    alert("Lengkapi input & pilih posisi");
    return;
  }

  const tpMove = tpPct / lev / 100;
  const slMove = slPct / lev / 100;

  let tpIdeal, slIdeal, tpFinal, slFinal;

  if (selectedTrade === "long") {
    tpIdeal = entry * (1 + tpMove);
    slIdeal = entry * (1 + slMove);
    tpFinal = nett ? tpIdeal / (1 - fee) : tpIdeal;
    slFinal = nett ? slIdeal / (1 + fee) : slIdeal;
  } else {
    tpIdeal = entry * (1 - tpMove);
    slIdeal = entry * (1 - slMove);
    tpFinal = nett ? tpIdeal * (1 - fee) : tpIdeal;
    slFinal = nett ? slIdeal * (1 + fee) : slIdeal;
  }

  result.innerHTML = `
    <div class="result-box">
      <p>Harga Take Profit (TP)</p>
      <div class="value" onclick="navigator.clipboard.writeText('${tpFinal.toFixed(6)}')">${tpFinal.toFixed(6)}</div>
      <p>Harga Stop Loss (SL)</p>
      <div class="value" onclick="navigator.clipboard.writeText('${slFinal.toFixed(6)}')">${slFinal.toFixed(6)}</div>
    </div>
  `;
}
</script>

</body>
</html>
