<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TP & SL Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Same styles as before, unchanged */
.result-box {
  background-color: #fff;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  margin-top: 8px;
  border: 1px solid #ccc;
}

.result-box p {
  font-size: 16px;
  font-weight: bold;
  color: #e5e7eb;
  margin-bottom: 4px;
}

.result-box .value {
  font-size: 18px;
  color: #000;
  padding: 6px;
  border-radius: 4px;
  background-color: #f3f4f6;
  border: 1px solid #ccc;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>TP & SL Calculator</h2>

<div class="card">
  <!-- Input fields remain unchanged -->
</div>

<div id="result" class="result"></div>

<script>
function calculate() {
  const entry = Number(document.getElementById("entryPrice").value);
  const tpPct = Number(document.getElementById("targetProfit").value);
  const slPct = Number(document.getElementById("targetLoss").value);
  const lev = Number(document.getElementById("leverage").value);

  if (!entry || entry <= 0) {
    alert("Harga entry belum diisi");
    return;
  }

  const tpMove = tpPct / lev / 100;
  const slMove = slPct / lev / 100;

  const tpPrice = entry * (1 + tpMove);
  const slPrice = entry * (1 + slMove);

  document.getElementById("result").innerHTML = `
    <div class="result-box">
      <p>Harga Take Profit (TP)</p>
      <div class="value" onclick="copyToClipboard('${tpPrice.toFixed(6)}')">${tpPrice.toFixed(6)}</div>

      <p>Harga Stop Loss (SL)</p>
      <div class="value" onclick="copyToClipboard('${slPrice.toFixed(6)}')">${slPrice.toFixed(6)}</div>
    </div>
  `;
}

function copyToClipboard(value) {
  const textArea = document.createElement('textarea');
  textArea.value = value;
  document.body.appendChild(textArea);
  textArea.select();
  document.execCommand('copy');
  document.body.removeChild(textArea);
  alert('Copied!');
}
</script>

</body>
</html>
